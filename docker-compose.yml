version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-news-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 下访问宿主机
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
